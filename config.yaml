# Switch engines here without touching code
# Primary LLM: NVIDIA NIM (fast, on-demand, OpenAI-compatible)
llm_model: "nvidia_nim/meta/llama-3.1-70b-instruct"
# Tier-2 fallback: Gemini (if NIM is unavailable)
fallback_llm: "gemini/gemini-2.5-flash"
# Tier-3 fallback: Groq (last resort)
fallback_llm_last_resort: "groq/llama-3.1-8b-instant"
# TTS engines
tts_engine: "kokoro"               # Local CPU
fallback_tts: "edge"               # Online Free
